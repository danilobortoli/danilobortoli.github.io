title: Danilo Bortoli
description: Um blog sobre tecnologia, ciência e outras coisas interessantes
lang: pt-BR
url: https://danilobortoli.github.io
baseurl: ""

# Jekyll settings
markdown: kramdown
highlighter: rouge
timezone: America/Sao_Paulo

# Kramdown settings for footnotes
kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  hard_wrap: false

# GitHub Pages plugins (whitelist)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-relative-links

# Collections
collections:
  notas:
    output: true
    permalink: /notas/:year-:month-:day-:hour-:minute/
    sort_by: date

# Defaults
defaults:
  - scope:
      path: ""
      type: "notas"
    values:
      layout: "nota"

# Exclude from processing
exclude:
  - README.md
  - .git
  - .github
  - _notas/_template.md
  - _posts/_template.md

