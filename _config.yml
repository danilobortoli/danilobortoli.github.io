title: Danilo Bortoli
tagline: advogado, ensaísta
description: Danilo Bortoli — advogado em direito público, tributário e empresarial. Ensaios sobre crítica cultural e direito, notas e arquivo pessoal.
author: Danilo Bortoli
lang: pt-BR
url: https://danilobortoli.github.io
baseurl: ""

# Verificação do Google Search Console (cole aqui o código da meta tag)
google_site_verification: "GbZmHAS36aapp_SePfSkRWhU_DplLGp7T5wWhE8MdDI"

# Jekyll settings
markdown: kramdown
highlighter: rouge
timezone: America/Sao_Paulo

# Kramdown settings for footnotes
kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  hard_wrap: false

# GitHub Pages plugins (whitelist)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-seo-tag

# Collections
collections:
  notas:
    output: true
    permalink: /notas/:year-:month-:day-:hour-:minute/
    sort_by: date

# Defaults
defaults:
  - scope:
      path: ""
      type: "notas"
    values:
      layout: "nota"
      extra_css: "notas.css"
      extra_head: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">

# TMDB API key (obtenha grátis em https://www.themoviedb.org/settings/api)
tmdb_api_key: "eaf970feafeeed38a6b698f623c66e94"

# Exclude from processing
exclude:
  - README.md
  - .git
  - .github
  - _notas/_template.md
  - _posts/_template.md
  - _guia-media-review.html
  - telegram-bot
  - vendor
  - Gemfile
  - Gemfile.lock

