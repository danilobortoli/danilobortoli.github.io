name: Processar Notas por Email

on:
  # Roda a cada 30 minutos
  schedule:
    - cron: '*/30 * * * *'
  # Permite executar manualmente
  workflow_dispatch:

jobs:
  process-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r scripts/requirements.txt

      - name: Processar emails e criar notas
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ALLOWED_SENDER: ${{ secrets.ALLOWED_SENDER }}
        run: |
          python scripts/process_email_notes.py

      - name: Configurar Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit e push das novas notas
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add _notas/
            git commit -m "Adicionar notas via email [skip ci]

https://claude.ai/code/session_01UFfxvyj3zSvsdKChdjWABt"
            git push
            echo "✅ Novas notas adicionadas e enviadas para o repositório"
          else
            echo "ℹ️ Nenhuma nota nova para adicionar"
          fi
