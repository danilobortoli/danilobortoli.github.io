name: Adicionar horário às notas

on:
  push:
    branches: [main]
    paths:
      - '_notas/**.md'

permissions:
  contents: write

jobs:
  fix-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adicionar horário às notas sem hora
        run: |
          AGORA=$(TZ="America/Sao_Paulo" date "+%H:%M:%S -0300")
          CHANGED=false

          for file in _notas/*.md; do
            [ "$file" = "_notas/_template.md" ] && continue
            if grep -qE '^date:[[:space:]]+[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*$' "$file"; then
              sed -i -E "s/^(date:[[:space:]]+[0-9]{4}-[0-9]{2}-[0-9]{2})[[:space:]]*$/\1 ${AGORA}/" "$file"
              echo "Horário adicionado: $file"
              CHANGED=true
            fi
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
        id: fix

      - name: Commit e push
        if: steps.fix.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _notas/
          git commit -m "Adicionar horário automático às notas"
          git push
