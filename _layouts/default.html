<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="https://edwardtufte.github.io/tufte-css/tufte.css"/>
  <style>
    .navigation {
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #ddd;
    }
    .navigation ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .navigation li {
      margin: 0;
    }
    .navigation a {
      text-decoration: none;
      color: #666;
      font-size: 1.4rem;
      transition: color 0.2s;
    }
    .navigation a:hover {
      color: #000;
      text-decoration: underline;
    }
    .navigation a.active {
      color: #000;
      font-weight: bold;
    }
    .intro-section {
      margin-top: 2rem;
    }
    .intro-section h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .intro-section p {
      font-size: 1.6rem;
      line-height: 1.8;
    }
    .credit-section {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid #eee;
      font-size: 1.3rem;
      color: #666;
    }
    .credit-section a {
      color: #666;
      text-decoration: underline;
    }
    .credit-section a:hover {
      color: #000;
    }
    .posts-list {
      list-style: none;
      padding: 0;
      margin-top: 2rem;
    }
    .posts-list li {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #eee;
    }
    .posts-list li:last-child {
      border-bottom: none;
    }
    .post-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .post-link:hover .post-title {
      text-decoration: underline;
    }
    .post-title {
      font-size: 2.4rem;
      margin-bottom: 0.5rem;
    }
    .post-date {
      font-size: 1.2rem;
      color: #666;
      font-style: italic;
      margin-bottom: 0.5rem;
    }
    .post-excerpt {
      margin-top: 0.5rem;
      font-size: 1.4rem;
      line-height: 1.6;
    }
    .post-meta {
      font-size: 1.2rem;
      color: #666;
      font-style: italic;
      margin-bottom: 2rem;
      margin-top: 1rem;
    }
    .about-content {
      margin-top: 2rem;
    }
    .about-content h2 {
      margin-top: 2rem;
    }
    .about-content p {
      font-size: 1.4rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <article>
    {% include navigation.html %}
    
    {{ content }}
  </article>
</body>
</html>
