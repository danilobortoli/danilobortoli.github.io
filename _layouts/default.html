<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="https://edwardtufte.github.io/tufte-css/tufte.css"/>
  <style>
    /* Force light mode for better readability */
    html {
      color-scheme: light;
    }
    
    body {
      background-color: #fffff8 !important;
      color: #111 !important;
    }
    
    /* Override dark mode styles */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #fffff8 !important;
        color: #111 !important;
      }
      
      article {
        background-color: #fffff8 !important;
        color: #111 !important;
      }
      
      h1, h2, h3, h4, h5, h6 {
        color: #111 !important;
      }
      
      p {
        color: #111 !important;
      }
      
      a {
        color: #1a73e8 !important;
      }
      
      a:hover {
        color: #1557b0 !important;
      }
      
      .navigation a {
        color: #666 !important;
      }
      
      .navigation a:hover {
        color: #000 !important;
      }
      
      .credit-section {
        color: #666 !important;
      }
      
      .credit-section a {
        color: #666 !important;
      }
      
      .credit-section a:hover {
        color: #000 !important;
      }
      
      .post-date,
      .post-meta {
        color: #666 !important;
      }
    }
    .navigation {
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #ddd;
    }
    .navigation ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .navigation li {
      margin: 0;
    }
    .navigation a {
      text-decoration: none;
      color: #666;
      font-size: 1.4rem;
      transition: color 0.2s;
    }
    .navigation a:hover {
      color: #000;
      text-decoration: underline;
    }
    .navigation a.active {
      color: #000;
      font-weight: bold;
    }
    .intro-section {
      margin-top: 2rem;
    }
    .intro-section h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .intro-section p {
      font-size: 1.6rem;
      line-height: 1.8;
    }
    .credit-section {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid #eee;
      font-size: 1.3rem;
      color: #666;
    }
    .credit-section a {
      color: #666;
      text-decoration: underline;
    }
    .credit-section a:hover {
      color: #000;
    }
    .posts-list {
      list-style: none;
      padding: 0;
      margin-top: 2rem;
    }
    .posts-list li {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #eee;
    }
    .posts-list li:last-child {
      border-bottom: none;
    }
    .post-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .post-link:hover .post-title {
      text-decoration: underline;
    }
    .post-title {
      font-size: 2.4rem;
      margin-bottom: 0.5rem;
    }
    .post-subtitle {
      font-size: 1.6rem;
      color: #666;
      font-style: italic;
      margin-top: -0.25rem;
      margin-bottom: 1rem;
      line-height: 1.4;
    }
    .post-date {
      font-size: 1.2rem;
      color: #666;
      font-style: italic;
      margin-bottom: 0.5rem;
    }
    .post-excerpt {
      margin-top: 0.5rem;
      font-size: 1.4rem;
      line-height: 1.6;
    }
    .post-meta {
      font-size: 1.2rem;
      color: #666;
      font-style: italic;
      margin-bottom: 2rem;
      margin-top: 1rem;
    }
    .about-content {
      margin-top: 2rem;
    }
    .about-content h2 {
      margin-top: 2rem;
    }
    .about-content p {
      font-size: 1.4rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <article>
    {% include navigation.html %}
    
    {{ content }}
  </article>
  
  <script>
    // Converte notas de rodapé do Kramdown para sidenotes do Tufte CSS
    (function() {
      'use strict';

      function convertFootnotesToSidenotes() {
        // Encontra todas as referências de notas de rodapé no texto
        const footnoteRefs = document.querySelectorAll('sup[id^="fnref:"]');
        
        if (footnoteRefs.length === 0) return;

        // Encontra o container de notas de rodapé
        const footnotesDiv = document.querySelector('.footnotes');
        if (!footnotesDiv) return;

        // Para cada referência de nota
        footnoteRefs.forEach((ref, index) => {
          const footnoteId = ref.id.replace('fnref:', '');
          const footnoteLink = ref.querySelector('a');
          
          if (!footnoteLink) return;

          // Encontra o conteúdo da nota de rodapé correspondente
          const footnoteItem = document.getElementById('fn:' + footnoteId);
          if (!footnoteItem) return;

          // Extrai o conteúdo da nota (remove o link de retorno)
          const footnoteContent = footnoteItem.cloneNode(true);
          const backref = footnoteContent.querySelector('.reversefootnote');
          if (backref) backref.remove();

          // Remove o primeiro <p> se houver apenas um parágrafo
          let content = footnoteContent.innerHTML.trim();
          if (content.startsWith('<p>') && content.endsWith('</p>')) {
            content = content.slice(3, -4);
          }

          // Cria a estrutura de sidenote do Tufte CSS
          const sidenoteNumber = index + 1;
          const label = document.createElement('label');
          label.setAttribute('for', 'sn-' + sidenoteNumber);
          label.className = 'margin-toggle sidenote-number';

          const input = document.createElement('input');
          input.setAttribute('type', 'checkbox');
          input.setAttribute('id', 'sn-' + sidenoteNumber);
          input.className = 'margin-toggle';

          const sidenote = document.createElement('span');
          sidenote.className = 'sidenote';
          sidenote.innerHTML = content;

          // Substitui a referência original pela estrutura de sidenote
          ref.parentNode.insertBefore(label, ref);
          ref.parentNode.insertBefore(input, ref);
          ref.parentNode.insertBefore(sidenote, ref);
          ref.remove();
        });

        // Remove a seção de notas de rodapé original
        footnotesDiv.remove();
      }

      // Executa quando o DOM estiver pronto
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', convertFootnotesToSidenotes);
      } else {
        convertFootnotesToSidenotes();
      }
    })();
  </script>
</body>
</html>
